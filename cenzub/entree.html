<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENZUB – Jeoffrécourt en 3D</title>
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:grid;place-items:center;height:100vh;margin:0}</style>
</head>
<body>
<div id="msg">Préparation de la scène…</div>
<script>
// Installe le service worker qui rejoue la scène enregistrée, puis ouvre la page.
(async () => {
  const msg = document.getElementById('msg');
  // Sans service worker (navigateur intégré à une messagerie, page hors
  // https), la page lit la scène par sans-sw.js : en ligne, elle s'ouvre
  // quand même ; hors réseau, il faut https ou localhost (LISEZMOI.txt).
  if ('serviceWorker' in navigator && window.isSecureContext) {
    // Un navigateur qui l'enregistre sans jamais le mettre aux commandes
    // laissait cette page sur « Préparation… » : 5 s au plus.
    const installer = (async () => {
      await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) {
        await new Promise(r => navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }));
      }
    })();
    try { await Promise.race([installer, new Promise(r => setTimeout(r, 5000))]); }
    catch (e) { /* la page se passera du service worker */ }
  }
  // ?vers= : la page à rouvrir, avec ses paramètres (app.html par défaut).
  const ici = new URLSearchParams(location.search);
  const vers = ['app.html', 'editeur.html'].includes(ici.get('vers')) ? ici.get('vers') : 'app.html';
  ici.delete('vers');
  const q = ici.toString();
  location.replace(vers + (q ? '?' + q : '__POINT__'));
})().catch(e => { document.getElementById('msg').textContent = 'Erreur : ' + e.message; });
</script>
</body>
</html>
