name: tmp repères (retiré avant fusion)
on:
  push:
    branches: [reperes-camp]
    paths: ['.github/workflows/tmp-reperes.yml', 'outils/tmp/**']
permissions:
  contents: write
jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/tmp/sonde.py
