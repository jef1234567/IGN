name: tmp repères (retiré avant fusion)
on:
  push:
    branches: [reperes-camp]
    paths: ['.github/workflows/tmp-reperes.yml']
permissions:
  contents: write
jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in lieu_dit_non_habite zone_d_habitation detail_orographique toponymie_lieux_nommes toponymie_voies_nommees troncon_de_route route_numerotee_ou_nommee; do
            echo "== $t"
            curl -s "https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=BDTOPO_V3:$t&COUNT=2&OUTPUTFORMAT=application/json&BBOX=43.68,6.40,43.72,6.48,urn:ogc:def:crs:EPSG::4326" | python3 -c "import json,sys
d=json.load(sys.stdin); f=d.get('features',[])
print(len(f), d.get('numberMatched'))
for x in f: print(x['geometry']['type'], {k:v for k,v in x['properties'].items() if v not in (None,'')})" 2>&1 | head -6
          done
