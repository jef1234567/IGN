name: Scène CENZUB (Jeoffrécourt)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cenzub/**', 'vue3d/**', '.github/workflows/cenzub.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  POINT: "?lat=49.5454&lon=3.9665&zone=1700"

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Dépendances
        run: |
          pip install -r requirements.txt
          npm install --no-save puppeteer-core@23
      - name: Image roofer (toits LiDAR)
        run: docker pull 3dgi/3dbag-pipeline-tools:2026.07.29
      - name: Serveur Vue 3D
        env:
          VUE3D_ROOFER: docker
          VUE3D_ROOFER_ZONE_MAX: "2000"
          VUE3D_ROOFER_DELAI: "2400"
          VUE3D_ORTHO_PX_PAR_KM: "2400"
          VUE3D_RELIEF_POINTS_PAR_KM: "1024"
          VUE3D_SANS_MASSES: "1"
        run: |
          mkdir -p cache
          VUE3D_CACHE=./cache VUE3D_QUOTA=1000 nohup flask --app vue3d.app run --port 8080 > serveur.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/sante >/dev/null && break; sleep 2; done
      - name: Construction et enregistrement de la scène
        run: CHROME=$(which google-chrome) node cenzub/figer.mjs "http://localhost:8080/${POINT}" site
      - name: Journal du serveur
        if: always()
        run: grep -v "api/tuile" serveur.log | grep -iE "roofer|nuage|WARNING|ERROR|Traceback|Error" | tail -n 60
      - name: Aperçu (branche apercus)
        run: |
          mkdir -p /tmp/ap && cp site/apercu.png /tmp/ap/ && cd /tmp/ap && git init -q -b apercus
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m apercu
          git add apercu.png && git -c user.name=ci -c user.email=ci@localhost commit -q -m "aperçu ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apercus
      - uses: actions/upload-artifact@v4
        with:
          name: cenzub-hors-reseau
          path: site
      # Les camps publiés par horizon.yml (publier) : branches site-<camp>,
      # rangées sous <camp>/ à côté de CENZUB. Après l'artefact hors réseau
      # de CENZUB, qui reste à sa taille.
      - name: Camps publiés en ligne (branches site-*)
        run: |
          for b in $(git ls-remote --heads origin 'site-*' | sed 's#.*refs/heads/##'); do
            git clone -q --depth 1 -b "$b" "https://github.com/${{ github.repository }}" "site/${b#site-}"
            rm -rf "site/${b#site-}/.git"
            echo "$b → ${b#site-}/ ($(du -sh "site/${b#site-}" | cut -f1))"
          done
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
