name: Scénario CENZUB (sans refiger la scène)

# Republie le site figé par cenzub.yml avec le scénario de cenzub/scenario.json
# (exporté par l'éditeur) ou, à défaut, de cenzub/scenario.xlsx :
# la scène n'est pas reconstruite, seul scenario.json change (quelques minutes
# au lieu d'une heure et plus). Le site repris est l'artefact du dernier
# cenzub.yml réussi sur main ; un artefact est gardé 90 jours, au-delà il
# faut relancer cenzub.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cenzub/scenario.xlsx', 'cenzub/scenario.json', 'outils/scenario.py']

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Site figé du dernier cenzub.yml réussi
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/cenzub.yml/runs?status=success&branch=main&per_page=1" \
               --jq '.workflow_runs[0].id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::Aucun cenzub.yml réussi sur main : lancer d'abord la construction complète."; exit 1
          fi
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n cenzub-hors-reseau -D site \
            || { echo "::error::Artefact du run $id introuvable (plus de 90 jours ?) : relancer cenzub.yml."; exit 1; }
      - name: Conversion du tableur
        run: |
          pip install openpyxl
          # Le scenario.json de l'éditeur, s'il y est, passe avant le tableur.
          if [ -f cenzub/scenario.json ]; then
            python outils/scenario.py cenzub/scenario.json site/scenario.json
          elif [ -f cenzub/scenario.xlsx ]; then
            python outils/scenario.py cenzub/scenario.xlsx site/scenario.json
          else
            rm -f site/scenario.json
            echo "Ni cenzub/scenario.json ni cenzub/scenario.xlsx : site republié sans scénario."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cenzub-hors-reseau
          path: site
      # Les camps publiés par horizon.yml (branches site-<camp>), comme dans
      # cenzub.yml : sans eux, republier le scénario effaçait canjuers/ du site.
      - name: Camps publiés en ligne (branches site-*)
        run: |
          for b in $(git ls-remote --heads origin 'site-*' | sed 's#.*refs/heads/##'); do
            git clone -q --depth 1 -b "$b" "https://github.com/${{ github.repository }}" "site/${b#site-}"
            rm -rf "site/${b#site-}/.git"
            echo "$b → ${b#site-}/ ($(du -sh "site/${b#site-}" | cut -f1))"
          done
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  publier:
    needs: convertir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
