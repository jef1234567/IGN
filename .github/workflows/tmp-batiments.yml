name: tmp bâtiments (retiré avant fusion)
on:
  push:
    branches: [batiments-camp]
    paths: ['.github/workflows/tmp-batiments.yml', 'outils/paquet_horizon.py']
permissions:
  contents: write
jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python outils/paquet_horizon.py batiments zones/canjuers.geojson canjuers-batiments.json && gzip -k canjuers-batiments.json && ls -l canjuers-batiments.json*
      - run: |
          mkdir -p /tmp/z && cp canjuers-batiments.json /tmp/z/ && cd /tmp/z && git init -q -b batiments-donnees
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -q -m "bâtiments Canjuers"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" batiments-donnees
